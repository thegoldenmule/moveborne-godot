        explode: false
        in: path
        name: type
        required: true
        schema:
          type: string
        style: simple
      - description: Session token of the user
        explode: true
        in: query
        name: session_token
        required: false
        schema:
          type: string
        style: form
      - description: Shared secret used to verify the request
