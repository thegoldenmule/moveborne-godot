components:
  schemas:
    Board:
      additionalProperties: true
      description: Game board. Extra fields from the game logic package are allowed.
      example:
        tiles:
        - isEmpty: true
          value: 0
        - isEmpty: true
          value: 0
      properties:
        tiles:
          items:
            $ref: "#/components/schemas/Tile"
          type: array
      type: object
    ConsumeItem_request:
      properties:
        consume_count:
          description: Number of units to consume
          format: int32
          type: integer
      required:
      - consume_count
      type: object
    ConvertUserCurrency_request:
      properties:
        amount:
          description: "Amount to convert (DEPRECATED: use amount_64)"
          format: int32
          type: integer
        amount_64:
          description: Amount to convert
          format: int64
          type: string
        from_currency:
          description: Name of the currency to convert from
          type: string
        to_currency:
          description: Name of the currency to convert to
          type: string
      required:
      - from_currency
      - to_currency
      type: object
    DisassociateLogin_request:
      properties:
        login_type:
          $ref: "#/components/schemas/authLoginTypeType"
      required:
      - login_type
      type: object
    Error:
      description: Standard error envelope returned by HTTP endpoints.
      example:
        error: VALIDATION_ERROR
        message: message
      properties:
        error:
          description: Machine-readable error code
          example: VALIDATION_ERROR
          type: string
        message:
          description: Human-readable message
          type: string
      required:
      - error
      - message
      type: object
    GrantAndOpenContainer_request:
      properties:
        require_balance:
          description: "If true, the user must have the required balance to be granted\
            \ the container"
          type: boolean
        sub_inventory_instance_id:
          description: Id of the sub-inventory instance to grant into
          type: string
        unlock_cost:
          $ref: "#/components/schemas/inventoryUnlockKey"
      type: object
    GrantItemsToUser_request:
      properties:
        items:
          additionalProperties:
            format: int32
            type: integer
          description: Unique name and count of items to grant to user
          type: object
        metadata:
          description: "Custom metadata to be attached to user inventory items, not\
            \ to be confused with catalog item metadata"
          type: object
        sub_inventory_instance_id:
          description: Sub inventory instance the granted items should be added to
          type: string
        sub_inventory_item_name:
          description: Name of the sub inventory item to be added to the sub inventory
            instance (Ignored if sub_inventory_instance_id is not set)
          type: string
      required:
      - items
      type: object
    HealthResponse:
      example:
        status: ok
        timestamp: 0
      properties:
        status:
          example: ok
          type: string
        timestamp:
          description: Epoch milliseconds
          format: int64
          type: integer
      required:
      - status
      - timestamp
      type: object
    IncrementScore_request:
      properties:
        delta:
          description: The delta of the score to increment
          format: double
          type: number
        tier_name:
          description: Name of the tier
          type: string
        user_metadata:
          description: Metadata to be stored with the user
          type: object
      required:
      - delta
      type: object
    IncrementTaskProgress_request:
      properties:
        delta:
          description: "Progress to update (Deprecated: Use delta64)"
          format: int32
          type: integer
        delta64:
          description: Progress to update
          format: int64
          type: integer
      type: object
    IncrementUserCurrency_request:
      properties:
        delta:
          description: "Amount to grant/consume (DEPRECATED: use delta_64)"
          format: int32
          type: integer
        delta_64:
          description: Amount to grant/consume
          format: int64
          type: string
      type: object
    MoveItemsToSubInventory_request:
      properties:
        item_instance_ids:
          description: Ids of the items to move into the sub-inventory
          items:
            type: string
          type: array
        sub_inventory_instance_id:
          description: Id of the sub-inventory instance to move the item into
          type: string
      required:
      - item_instance_ids
      - sub_inventory_instance_id
      type: object
    OpenContainer_request:
      properties:
        escrow_id:
          description: "Escrow id for the result, if it was evaluated already"
          type: string
        sub_inventory_instance_id:
          description: Id of the sub-inventory instance to grant into
          type: string
        unlock_cost:
          $ref: "#/components/schemas/inventoryUnlockKey"
      type: object
    PurchaseItemWithVirtualCurrency_request:
      properties:
        catalog_item_name:
          description: Name of catalog item to purchase
          type: string
        currency_name:
          description: Name of virtual currency to purchase item with
          type: string
        sub_inventory_instance_id:
          description: Sub inventory instance the purchased items should be added
            to
          type: string
      type: object
    ServiceInfo:
      example:
        endpoints:
          health: /health
          matchInit: /api/match/init
          socketio: /socket.io/
          status: /api/status
        message: Moveborne Validator Service
      properties:
        endpoints:
          additionalProperties:
            type: string
          example:
            health: /health
            matchInit: /api/match/init
            socketio: /socket.io/
            status: /api/status
          type: object
        message:
          example: Moveborne Validator Service
          type: string
      type: object
    SetScore_request:
      properties:
        score:
          description: New score to be inserted
          format: double
          type: number
        tier_name:
          description: Name of the tier
          type: string
        user_metadata:
          description: Metadata to be stored with the user
          type: object
      required:
      - score
      type: object
    StateHistorySnapshot:
      example:
        moveIndex: 0
        state:
          score: 1
          randomSeeds:
            key: ""
          gameStatus: IN_PROGRESS
          moveIndex: 6
          board:
            tiles:
            - isEmpty: true
              value: 0
            - isEmpty: true
              value: 0
          rngIndices:
            key: ""
        timestamp: 6
      properties:
        moveIndex:
          type: integer
        state:
          $ref: "#/components/schemas/SynchronizedGameState"
        timestamp:
          description: Epoch milliseconds
          format: int64
          type: integer
      required:
      - moveIndex
      - state
      type: object
    StatusResponse:
      example:
        server: validator
        version: 0.1.0
        connections: 0
        uptime: 6.027456183070403
      properties:
        connections:
          description: Active Socket.IO client count
          type: integer
        server:
          example: validator
          type: string
        uptime:
          description: Process uptime in seconds
          format: double
          type: number
        version:
          example: 0.1.0
          type: string
      required:
      - connections
      - server
      - uptime
      - version
      type: object
    SynchronizedGameState:
      additionalProperties: true
      description: "Deterministic, hashable game state shared between client and validator.\
        \ Defined by @spyre-io/moveborne-logic; only the fields the validator reads\
        \ are described here and additional fields are allowed."
      example:
        score: 1
        randomSeeds:
          key: ""
        gameStatus: IN_PROGRESS
        moveIndex: 6
        board:
          tiles:
          - isEmpty: true
            value: 0
          - isEmpty: true
            value: 0
        rngIndices:
          key: ""
      properties:
        board:
          $ref: "#/components/schemas/Board"
        gameStatus:
          description: "e.g. IN_PROGRESS, GAME_OVER"
          example: IN_PROGRESS
          type: string
        moveIndex:
          description: Monotonic action index
          type: integer
        randomSeeds:
          additionalProperties: true
          description: Seeds for the deterministic RNG streams.
          type: object
        rngIndices:
          additionalProperties: true
          description: Per-stream RNG consumption indices.
          type: object
        score:
          type: integer
      required:
      - board
      - gameStatus
      - moveIndex
      - rngIndices
      type: object
    Tile:
      additionalProperties: true
      description: A single board cell. Shape is defined by the game logic package;
        extra fields are allowed.
      example:
        isEmpty: true
        value: 0
      properties:
        isEmpty:
          type: boolean
        value:
          type: integer
      type: object
    UnlockContainer_request:
      properties:
        unlock_cost:
          $ref: "#/components/schemas/inventoryUnlockKey"
      type: object
    UpdateTaskMetadata_request:
      properties:
        metadata:
          description: Metadata to attach to task
          type: object
      required:
      - metadata
      type: object
    UpdateUserItemMetadata_request:
      properties:
        metadata:
          description: Metadata to be attached to user inventory item. Not be confused
            with metadata with catalog item
          type: object
      type: object
    ValidatorInitFromHistoryRequest:
      description: Provide exactly one of history_file_id or history_data.
      example:
        history_data:
        - moveIndex: 0
          state:
            score: 1
            randomSeeds:
              key: ""
            gameStatus: IN_PROGRESS
            moveIndex: 6
            board:
              tiles:
              - isEmpty: true
                value: 0
              - isEmpty: true
                value: 0
            rngIndices:
              key: ""
          timestamp: 6
        - moveIndex: 0
          state:
            score: 1
            randomSeeds:
              key: ""
