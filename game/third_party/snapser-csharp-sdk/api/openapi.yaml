      x-snapser-auth-passthrough: true
      x-snapser-auth-types:
      - user
      - api-key
      - internal
  /health:
    get:
      description: Liveness/readiness probe. Always returns 200 with a timestamp when
        the process is up. Used as the BYOSnap readiness probe path.
      operationId: byosnap-validator.getHealth
      responses:
        "200":
          content:
            application/json:
