      x-snapser-auth-passthrough: true
      x-snapser-auth-types:
      - user
      - api-key
      - internal
  /socket.io/:
    get:
      description: "Engine.IO/Socket.IO transport endpoint. Clients first GET to obtain\
        \ a session id, then upgrade to WebSocket. The handshake `auth` payload must\
        \ include `connection_id` (from /api/match/init) and `player_id`. After connection\
        \ the server emits `ready`; clients emit `validate_action` ({ index, action,\
        \ state_hash }) and receive a signed match/mismatch response. This endpoint\
        \ is a real-time transport and is only partially describable in OpenAPI."
      operationId: byosnap-validator.socketIoTransportGet
      parameters:
      - description: Engine.IO protocol version
        explode: true
        in: query
        name: EIO
        required: false
        schema:
          type: string
        style: form
      - description: Transport type (polling or websocket)
        explode: true
        in: query
        name: transport
        required: false
        schema:
          enum:
          - polling
          - websocket
          type: string
        style: form
      - description: Engine.IO session id (after handshake)
        explode: true
        in: query
        name: sid
        required: false
        schema:
          type: string
        style: form
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade)
        "200":
          description: Engine.IO transport response (handshake or polling payload)
      summary: Socket.IO transport (handshake / poll / WebSocket upgrade)
      tags:
      - Realtime
      x-snapser-auth-passthrough: true
      x-snapser-auth-types:
      - user
      - api-key
      - internal
    post:
      description: Engine.IO polling-transport write channel. Used by the long-polling
        fallback to send client packets.
      operationId: byosnap-validator.socketIoTransportPost
      parameters:
      - explode: true
        in: query
        name: EIO
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: transport
        required: false
        schema:
          enum:
          - polling
          - websocket
          type: string
        style: form
      - explode: true
        in: query
        name: sid
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        required: false
      responses:
        "200":
          description: Acknowledged
      summary: Socket.IO transport (polling write)
      tags:
      - Realtime
      x-snapser-auth-passthrough: true
      x-snapser-auth-types:
      - user
      - api-key
      - internal
  /v1/auth/app-verify/{type}:
