openapi: 3.0.1
info:
  description: Your custom SDK
  title: dev
  version: "dev: v9 SDK"
servers:
- url: https://gateway.snapser.com/c4n1awfs
tags:
- name: InventoryService
- name: LeaderboardsService
- name: QuestsService
- name: AuthService
- description: Service info and health
  name: Service
- description: Match lifecycle and state history
  name: Match
- description: Socket.IO transport for live validation
  name: Realtime
- description: MCP inspection/debugging interface
  name: Debug
paths:
  /:
    get:
      description: Returns a human-readable summary of the service and its primary
        endpoints.
      operationId: byosnap-validator.getServiceInfo
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"
          description: Service information
      summary: Service info
      tags:
      - Service
      x-snapser-auth-passthrough: true
      x-snapser-auth-types:
      - user
      - api-key
      - internal
  /api/match/init:
    post:
      description: "Registers a new match with its starting synchronized state and\
        \ returns a short-lived connection token used to open the Socket.IO connection.\
        \ Unless DEV_MODE is enabled, the request `signature` is verified against\
        \ the shared secret."
      operationId: byosnap-validator.initMatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidatorInitRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidatorInitResponse"
          description: Match initialized
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing required fields
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid signature
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal error
      summary: Initialize a match
      tags:
      - Match
      x-snapser-auth-passthrough: true
      x-snapser-auth-types:
      - user
      - api-key
      - internal
  /api/match/init-from-history:
    post:
      description: Creates a replay match from a previously saved state history. Provide
        either `history_file_id` (looked up in the history store or fixtures) or inline
        `history_data`. Optionally start from a specific `start_from_index`.
      operationId: byosnap-validator.initMatchFromHistory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidatorInitFromHistoryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidatorInitResponse"
          description: Match initialized from history
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Validation error (missing player_id, no history source, empty/invalid\
            \ history, or no state at start index)"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: History not found in store or filesystem
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal error
      summary: Initialize a match from a saved state history
      tags:
      - Match
      x-snapser-auth-passthrough: true
      x-snapser-auth-types:
      - user
      - api-key
      - internal
  /api/status:
    get:
      description: "Reports server name, version, process uptime, and current Socket.IO\
        \ connection count."
      operationId: byosnap-validator.getStatus
      responses:
        "200":
          content:
            application/json:
              schema:
